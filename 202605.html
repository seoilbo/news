<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Leaflet 실제 노선도 구현</title>
    <!-- 1. Leaflet CSS 및 JS 불러오기 -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    
    <!-- 2. CSV 파싱을 위한 PapaParse 라이브러리 로드 -->
    <script src="https://cloudflare.com"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 3. Leaflet 지도 초기화 (동탄역 중심으로 설정)
        var map = L.map('map').setView([37.20034, 127.09569], 12);

        // 배경 지도 타일 추가 (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 선을 그릴 좌표들을 담을 배열
        var lineCoordinates = [];

        // 4. 외부 CSV 파일(jae/subway.csv) 비동기 로드
        Papa.parse("jae/subway.csv", {
            download: true,
            header: true, // 첫 줄을 필드명으로 인식
            skipEmptyLines: true,
            complete: function(results) {
                var data = results.data;

                // 순번(또는 정렬 기준)대로 데이터 정렬 (안전장치)
                data.sort((a, b) => parseInt(a.순번) - parseInt(b.순번));

                // 데이터 처리 루프
                data.forEach(function(row) {
                    var lat = parseFloat(row.위도);
                    var lng = parseFloat(row.경도);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        // 모든 좌표(역 + 곡선점)를 선 경로 배열에 추가
                        lineCoordinates.push([lat, lng]);

                        // 만약 실제 '역' 데이터라면 마커와 팝업 생성
                        if (row.타입 === "역") {
                            L.marker([lat, lng])
                             .addTo(map)
                             .bindPopup(`<b>${row.이름}</b><br>${row.호선}`);
                        }
                    }
                });

                // 5. 수집된 모든 좌표 배열로 실제 구불구불한 선 그리기
                if (lineCoordinates.length > 0) {
                    var polyline = L.polyline(lineCoordinates, {
                        color: '#0052A4', // 노선 색상 (예: 1호선/GTX 색상 등)
                        weight: 6,        // 선 두께
                        opacity: 0.8,     // 선 투명도
                        lineJoin: 'round' // 꺾이는 부분 부드럽게 처리
                    }).addTo(map);

                    // 선이 전체 다 보이도록 지도 화면 맞춤
                    map.fitBounds(polyline.getBounds());
                }
            },
            error: function(err) {
                console.error("CSV 파일을 불러오는 중 오류가 발생했습니다:", err);
            }
        });
    </script>
</body>
</html>
