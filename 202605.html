<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaflet 노선도 교정 테스트</title>
    
    <!-- 다시 원래대로 가장 깔끔한 외부 주소로 적용합니다 -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        html, body, #map {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        window.addEventListener('load', function() {
            // 1. 지도 초기화
            var map = L.map('map').setView([37.20034, 127.09569], 11);

            // 2. 배경 지도 타일 추가
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            var lineCoordinates = [];

            // 3. CSV 비동기 불러오기
            Papa.parse("jae/subway.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    var data = results.data;

                    if (!data || data.length === 0) {
                        console.warn("CSV 데이터가 비어있습니다.");
                        return;
                    }

                    // [교정] 배열 내부 첫 번째 원소에 '순번' 필드가 있는지 안전하게 체크 후 정렬
                    if (data[0] && data[0].순번 !== undefined) {
                        data.sort((a, b) => parseInt(a.순번) - parseInt(b.순번));
                    }

                    // 데이터 순회하며 마커 및 좌표 수집
                    data.forEach(function(row) {
                        var lat = parseFloat(row.위도);
                        var lng = parseFloat(row.경도);

                        if (!isNaN(lat) && !isNaN(lng)) {
                            lineCoordinates.push([lat, lng]);

                            // 타입이 '역'이거나 역사명 필드가 있는 경우 마커 표시
                            if (row.타입 === "역" || (row.역사명 && !row.타입)) {
                                var stationName = row.역사명 || row.이름 || "지하철역";
                                var lineName = row.호선 || "";
                                
                                L.marker([lat, lng])
                                 .addTo(map)
                                 .bindPopup(`<b>${stationName}</b><br>${lineName}`);
                            }
                        }
                    });

                
                },
                error: function(err) {
                    console.error("CSV 로드 실패:", err);
                }
            });
        });
    </script>
</body>
</html>
