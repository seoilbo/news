<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="동네개발맵 - 서오일보">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/thum_OG.jpg">
    <title>동네개발맵 - 서오일보</title>
    <link rel="icon" href="assets/favi.png" type="image/png">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --hover-bg: #f2f4f6;   /* 헤더를 제외한 모든 hover 반응: 연한 회색 */
            --line: #d1d8dd;
            --px: 20px;            /* 왼쪽 패널 좌우 여백 */
            --search-h: 57px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 페이지 전체는 스크롤 없이 화면 높이에 고정: 헤더 + 분할 화면 */
        html, body {
            overflow: hidden;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #222222;
            line-height: 1.6;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        button {
            font-family: inherit;
        }

        /* ===== 헤더 (인덱스와 동일) ===== */
        .large-header {
            width: 100%;
            flex-shrink: 0;
            background-color: #ffffff;
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 10;
        }

        .header-main-bar {
            height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
        }

        .header-container {
            max-width: 1160px;
            width: 100%;
            margin: 0 auto;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }

        .logo-link {
            display: block;
            text-decoration: none;
        }

        .logo-img-large {
            height: 60px;
            width: auto;
            display: block;
        }

        .sub-info-bar {
            background-color: #ffffff;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid #000000;
            font-size: 12px;
            color: #555555;
            height: 36px;
            display: flex;
            align-items: center;
        }

        .sub-info-inner {
            max-width: 1160px;
            width: 100%;
            margin: 0 auto;
            padding: 0 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .current-date {
            flex-shrink: 0;
        }

        .sub-nav-categories {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .sub-nav-categories a {
            text-decoration: none;
            color: #333333;
            font-size: 13px;
            font-weight: 500;
            transition: none;
        }

        /* 헤더 hover는 기존 그대로 (빨강 + 굵게) */
        .sub-nav-categories a:hover {
            color: #a61c1c;
            font-weight: 700;
        }

        /* ===== 분할 화면: 왼쪽 정보·기사 / 오른쪽 지도 ===== */
        .split {
            flex: 1;
            min-height: 0;
            display: flex;
            position: relative;
            isolation: isolate;
        }

        .left-panel {
            width: 400px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #ffffff;
            border-right: 1px solid var(--line);
            position: relative;
            z-index: 2;
        }

        #map {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        /* 구역을 눌렀을 때 도형 바깥에 생기는 네모(포커스 테두리) 제거 */
        .leaflet-container {
            -webkit-tap-highlight-color: transparent;
        }

        .leaflet-container .leaflet-interactive:focus,
        .leaflet-container path:focus,
        .leaflet-container svg:focus,
        .leaflet-container *:focus {
            outline: none !important;
        }

        .zone-tip {
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 0;
        }

        /* 축소했을 때 보이는 자치구별 정비구역 개수 원 (크림슨 반투명) */
        .gu-circle-icon {
            background: none;
            border: none;
        }

        .gu-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.15;
            color: #ffffff;
            background: rgba(220, 20, 60, 0.78);
            cursor: pointer;
        }

        .gu-name {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .gu-count {
            font-size: 18px;
            font-weight: 800;
        }

        /* 검색 */
        .search-bar {
            height: var(--search-h);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 var(--px);
            background: #ffffff;
            border-bottom: 1px solid var(--line);
        }

        .search-bar input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #c9d0d6;
            border-radius: 0;
            font: inherit;
            font-size: 14px;
            color: #222222;
            background: #ffffff;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #111111;
        }

        .toggle-btn {
            display: none;
            height: 36px;
            padding: 0 14px;
            background: #ffffff;
            border: 1px solid #c9d0d6;
            font-size: 13px;
            font-weight: 700;
            color: #111111;
            cursor: pointer;
        }

        .toggle-btn:hover {
            background: var(--hover-bg);
        }

        /* 패널 본문 */
        .panel-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }

        .view.active {
            display: flex;
        }

        .scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding-bottom: 12px;
        }

        .panel-title {
            flex-shrink: 0;
            padding: 14px var(--px) 6px;
            font-size: 14px;
            font-weight: 800;
            color: #a61c1c;
            letter-spacing: -0.3px;
        }

        .panel-title .count {
            margin-left: 6px;
            font-weight: 500;
            color: #999999;
        }

        .panel-msg {
            padding: 14px var(--px);
            font-size: 13px;
            color: #888888;
        }

        .panel-msg.error {
            color: #a61c1c;
        }

        /* 구역 목록 (자치구 폴더) */
        .folder-title {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px var(--px) 8px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #e5e8eb;
            font-size: 13px;
            font-weight: 700;
            color: #555555;
            cursor: pointer;
            text-align: left;
        }

        .folder-title:hover {
            background: var(--hover-bg);
        }

        .folder-count {
            margin-left: 6px;
            font-weight: 500;
            color: #999999;
        }

        .folder-items[hidden] {
            display: none;
        }

        .item-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px;
            padding: 10px var(--px);
            background: transparent;
            border: none;
            font-size: 14px;
            font-weight: 500;
            color: #222222;
            text-align: left;
            cursor: pointer;
        }

        .item-row:hover {
            background: var(--hover-bg);
        }

        .row-sub {
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 500;
            color: #999999;
        }

        /* 구역 상세 */
        .back-btn {
            align-self: stretch;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px var(--px);
            background: transparent;
            border: none;
            border-bottom: 1px solid #e5e8eb;
            font-size: 14px;
            font-weight: 600;
            color: #111111;
            cursor: pointer;
            text-align: left;
        }

        .back-btn:hover {
            background: var(--hover-bg);
        }

        .back-arrow-img {
            width: 14px;
            height: 14px;
            transform: rotate(180deg);
        }

        .detail-scroll {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .info-area {
            flex: 0 1 auto;
            max-height: 55%;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 18px var(--px);
            border-bottom: 1px solid #222222;
        }

        .news-area {
            flex: 1 1 0;
            min-height: 140px;
            display: flex;
            flex-direction: column;
        }

        .news-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
        }

        .detail-image-wrapper {
            width: 100%;
            max-height: 200px;
            overflow: hidden;
            margin-bottom: 14px;
            background: #eeeeee;
        }

        .detail-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-district {
            font-size: 12px;
            font-weight: 700;
            color: #a61c1c;
            margin-bottom: 2px;
        }

        .detail-title {
            font-size: 20px;
            font-weight: 800;
            color: #111111;
            line-height: 1.35;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .detail-desc {
            font-size: 14px;
            line-height: 1.7;
            color: #333333;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .detail-desc a {
            color: #a61c1c;
        }

        /* 기사 목록 (관련 뉴스 / 검색 결과 공통) */
        .news-item {
            display: flex;
            gap: 10px;
            padding: 10px var(--px);
            border-bottom: 1px solid #eeeeee;
            text-decoration: none;
            color: inherit;
        }

        .news-item:hover {
            background: var(--hover-bg);
        }

        .news-thumb {
            width: 84px;
            aspect-ratio: 16 / 10;
            flex-shrink: 0;
            background: #eeeeee;
            overflow: hidden;
        }

        .news-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-text {
            min-width: 0;
        }

        .news-title {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.4;
            color: #111111;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-date {
            margin-top: 4px;
            font-size: 12px;
            color: #888888;
        }

        .folder-title:focus-visible,
        .item-row:focus-visible,
        .back-btn:focus-visible,
        .toggle-btn:focus-visible,
        .news-item:focus-visible {
            outline: 2px solid #a61c1c !important;
            outline-offset: -2px;
        }

        /* ===== 모바일 =====
           기본: 위에 검색 줄 + 지도
           '목록' 버튼 / 검색창 선택: 목록·검색 화면으로 전환
           구역을 누르면: 지도에서 구역 상세 화면으로 전환 */
        @media (max-width: 768px) {
            :root { --px: 16px; }

            .sub-info-bar { display: none; }
            .header-main-bar { height: 70px; }
            .logo-img-large { height: 40px; }

            .left-panel {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                width: auto;
                z-index: 1100;
                border-right: none;
                border-bottom: 1px solid var(--line);
            }

            #map {
                position: absolute;
                top: var(--search-h);
                left: 0;
                right: 0;
                bottom: 0;
                flex: none;
            }

            .toggle-btn {
                display: inline-block;
            }

            /* 지도 화면: 검색 줄만 보임 */
            .split[data-mobilemap="1"][data-detail="0"] .panel-body {
                display: none;
            }

            /* 목록·검색 화면 또는 상세 화면: 패널이 화면 전체를 덮음 */
            .split[data-mobilemap="0"] .left-panel,
            .split[data-detail="1"] .left-panel {
                bottom: 0;
                border-bottom: none;
            }

            /* 상세 화면에서는 검색 줄 대신 돌아가기 버튼 */
            .split[data-detail="1"] .search-bar {
                display: none;
            }

            /* 상세 화면은 한 화면으로 이어서 스크롤 */
            .detail-scroll {
                display: block;
                overflow-y: auto;
                overscroll-behavior: contain;
            }

            .info-area {
                max-height: none;
                overflow: visible;
                border-bottom: none;
            }

            .news-area {
                display: block;
                min-height: 0;
                border-top: 8px solid var(--hover-bg);
            }

            .news-scroll {
                overflow: visible;
                padding-bottom: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- 헤더 -->
    <div class="large-header" id="largeHeader">
        <div class="header-main-bar">
            <div class="header-container">
                <a href="index.html" class="logo-link">
                    <img src="assets/seologo.png" alt="서오일보 로고" class="logo-img-large">
                </a>
            </div>
        </div>
        <div class="sub-info-bar">
            <div class="sub-info-inner">
                <span class="current-date" id="headerDate">2026.09.29 (화)</span>
                <nav class="sub-nav-categories">
                    <a href="category.html?type=social">사회</a>
                    <a href="category.html?type=economy">경제</a>
                    <a href="category.html?type=politics">정치</a>
                    <a href="category.html?type=realestate">부동산</a>
                    <a href="category.html?type=culture">문화</a>
                    <a href="category.html?type=opinion">오피니언</a>
                    <a href="jae.html">동네개발맵</a>
                    <a href="https://sin13248920.github.io/weekly-seo-e-viewer/">월간서오</a>
                </nav>
            </div>
        </div>
    </div>

    <!-- 분할 화면: 왼쪽 = 검색·구역 정보·기사 / 오른쪽 = 지도 -->
    <main class="split" id="split" data-detail="0" data-mobilemap="1">
        <aside class="left-panel">
            <div class="search-bar">
                <input id="searchInput" type="search" placeholder="구역·기사 검색" autocomplete="off" aria-label="구역과 기사 검색">
                <button class="toggle-btn" id="toggleBtn" type="button">목록</button>
            </div>

            <div class="panel-body">
                <!-- 1. 구역 목록 -->
                <div id="listView" class="view active">
                    <div class="scroll" id="folder-list">
                        <div class="panel-msg">구역 정보를 불러오는 중...</div>
                    </div>
                </div>

                <!-- 2. 검색 결과 -->
                <div id="searchView" class="view">
                    <div class="scroll" id="search-results"></div>
                </div>

                <!-- 3. 구역 상세: 정보 + 관련 뉴스 -->
                <div id="detailView" class="view">
                    <button class="back-btn" id="backBtn" type="button">
                        <img src="assets/rarrow.png" class="back-arrow-img" alt="" onerror="this.style.display='none'">
                        <span id="backLabel">목록으로 돌아가기</span>
                    </button>
                    <div class="detail-scroll">
                        <section class="info-area" id="detail-content"></section>
                        <section class="news-area">
                            <div class="panel-title">관련 뉴스</div>
                            <div class="news-scroll" id="news-list">
                                <div class="panel-msg">뉴스를 불러오는 중...</div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </aside>

        <div id="map"></div>
    </main>

    <!-- Leaflet JS 및 Omnivore (KML 로더) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js'></script>

    <script>
        /* =====================================================
           헤더 날짜 (인덱스와 동일)
        ===================================================== */
        window.addEventListener('DOMContentLoaded', function() {
            const dateEl = document.getElementById('headerDate');
            if (dateEl) {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const week = ['일', '월', '화', '수', '목', '금', '토'][now.getDay()];
                dateEl.innerText = `${year}.${month}.${day} (${week})`;
            }
        });

        /* =====================================================
           공통 유틸
        ===================================================== */
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function norm(s) {
            return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
        }

        function stripTags(s) {
            return String(s == null ? '' : s).replace(/<[^>]*>/g, ' ');
        }

        function getImageUrl(imageField) {
            if (!imageField) return null;
            if (typeof imageField === 'string') return imageField;
            if (typeof imageField === 'object' && imageField.url) return imageField.url;
            return null;
        }

        const DEFAULT_THUMB = 'assets/thum_OG.jpg';
        const THUMB_ONERROR = "this.onerror=null;this.src='" + DEFAULT_THUMB + "'";

        function getThumbUrl(imageField) {
            return getImageUrl(imageField) || DEFAULT_THUMB;
        }

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        /* =====================================================
           자치구 판별
           - 서울 25개 구 이름이 KML 설명(또는 이름)에 있으면 그 구
           - 구 이름이 없으면 '기타 구역' 폴더
        ===================================================== */
        const SEOUL_GU = [
            '강남구', '강동구', '강북구', '강서구', '관악구', '광진구', '구로구', '금천구', '노원구',
            '도봉구', '동대문구', '동작구', '마포구', '서대문구', '서초구', '성동구', '성북구', '송파구',
            '양천구', '영등포구', '용산구', '은평구', '종로구', '중구', '중랑구'
        ];
        // 동 이름만 적힌 경우를 위한 보조 매핑 (필요하면 추가)
        const AREA_ALIAS = { '반포': '서초구' };
        const ETC = '기타 구역';

        function getDistrict(name, description) {
            const text = stripTags(description) + ' ' + String(name || '');
            for (const gu of SEOUL_GU) {
                if (text.includes(gu)) return gu;
            }
            for (const key in AREA_ALIAS) {
                if (text.includes(key)) return AREA_ALIAS[key];
            }
            return '';
        }

        /* =====================================================
           지도 초기화
        ===================================================== */
        const map = L.map('map', { zoomControl: false, attributionControl: false, maxBoundsViscosity: 1.0 }).setView([37.5665, 126.9780], 13);

        // 자치구 경계선 / 서울 밖 흐림 막 전용 레이어 (구역 도형 아래, 클릭 방해 없음)
        map.createPane('maskPane').style.zIndex = 350;
        map.createPane('boundaryPane').style.zIndex = 390;
        map.getPane('maskPane').style.pointerEvents = 'none';
        map.getPane('boundaryPane').style.pointerEvents = 'none';

        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.attribution({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        window.addEventListener('resize', function() { map.invalidateSize(); applySeoulLimits(); });

        const defaultStyle = { color: '#3388ff', fillColor: '#3388ff', fillOpacity: 0.2 };
        const selectedStyle = { color: '#ff0000', fillColor: '#ff4757', fillOpacity: 0.5, weight: 3 };

        const splitEl = document.getElementById('split');
        const searchInput = document.getElementById('searchInput');
        const toggleBtn = document.getElementById('toggleBtn');
        const folderListEl = document.getElementById('folder-list');
        const searchResultsEl = document.getElementById('search-results');
        const detailContentEl = document.getElementById('detail-content');
        const newsListEl = document.getElementById('news-list');
        const backBtn = document.getElementById('backBtn');
        const backLabelEl = document.getElementById('backLabel');

        let zones = [];            // { name, description, district, haystack, layer }  (지도에는 배율·위치에 따라 필요할 때만 추가)
        let currentZone = null;
        let mobileMap = true;      // 모바일: true = 지도 화면, false = 목록·검색 화면
        let openedFrom = 'map';    // 구역을 연 곳: 'map' | 'panel'

        /* =====================================================
           KML 불러오기
           - jae/seoulgu.kml : 서울 25개 자치구 경계 (도형 이름: 동대문구, 금천구 ...)
           - jae/jae.kml     : 정비구역 (아직 옮기기 전이면 assets/jae.kml 도 자동으로 시도)
           자치구 KML이 없어도 구역 지도는 그대로 동작합니다 (원 표시·경계·서울 밖 제한만 빠짐)
        ===================================================== */
        const GU_KML_URL = 'jae/seoulgu.kml';
        const ZONE_KML_URLS = ['jae/jae.kml', 'assets/jae.kml', 'jae.kml'];

        const DEBUG = true;       // 문제가 해결되면 false 로 바꾸면 콘솔 안내 로그가 사라짐
        const ZOOM_ZONES = 14;    // 이 배율보다 더 축소하면 구역 대신 자치구별 개수 원을 표시 (숫자가 클수록 원이 더 빨리 나타남)
        const BOUND_PAD = 0.08;   // 서울 경계 바깥으로 벗어날 수 있는 여유 (경계 크기 대비 비율)

        let guList = [];          // { name, rings, bounds, center, count }
        const guByName = {};
        let seoulBounds = null;
        let circlesGroup = null;

        /* ---------- KML 읽기 ----------
           KML을 직접 내려받아 먼저 검사합니다.
           - 이름·설명(이미지 주소 포함)에 '&' 같은 특수문자가 있어 XML이 깨진 경우를 자동 보정
           - 그래도 깨져 있으면 어디가 문제인지 화면에 표시 (예전에는 도형이 0개로 조용히 사라졌음) */
        const kmlTried = [];
        const kmlInfo = {};      // url -> { placemarks, fixed }
        let zoneKmlUrl = '';

        function sanitizeKml(text) {
            return String(text)
                .replace(/^\uFEFF/, '')                                              // BOM
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')            // XML에서 쓸 수 없는 제어문자
                .replace(/<description>([\s\S]*?)<\/description>/g, function(m, inner) {   // CDATA 없이 적힌 HTML(<img> 등) 설명을 CDATA로 감쌈
                    if (inner.indexOf('<') === -1 || inner.indexOf('<![CDATA[') !== -1) return m;
                    return '<description><![CDATA[' + inner.replace(/\]\]>/g, ']]]]><![CDATA[>') + ']]></description>';
                })
                .replace(/&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;'); // 엔티티가 아닌 '&'
        }

        function parseXml(text) {
            const doc = new DOMParser().parseFromString(text, 'text/xml');
            const errEl = doc.getElementsByTagName('parsererror')[0];
            return { doc: doc, error: errEl ? errEl.textContent.trim().replace(/\s+/g, ' ').slice(0, 220) : '' };
        }

        function loadKmlLegacy(url) {
            return new Promise(function(resolve, reject) {
                omnivore.kml(url)
                    .on('ready', function() { resolve(this); })
                    .on('error', function(err) { reject(err); });
            });
        }

        async function loadKml(url) {
            if (!(omnivore.kml && typeof omnivore.kml.parse === 'function')) {
                return loadKmlLegacy(url);
            }

            let res;
            try {
                res = await fetch(url, { cache: 'no-cache' });
            } catch (e) {
                e.notFound = true;
                throw e;
            }
            if (!res.ok) {
                const err = new Error(url + ' 을(를) 찾을 수 없습니다 (HTTP ' + res.status + ')');
                err.notFound = true;
                throw err;
            }

            const raw = await res.text();
            const text = sanitizeKml(raw);
            const parsed = parseXml(text);
            kmlInfo[url] = {
                placemarks: parsed.doc.getElementsByTagName('Placemark').length,
                fixed: text !== raw
            };

            if (parsed.error) {
                throw new Error(url + ' 의 XML 형식이 올바르지 않습니다: ' + parsed.error);
            }
            return omnivore.kml.parse(text);
        }

        // 주소 목록을 앞에서부터 시도 (파일이 없을 때만 다음 주소로. 형식 오류는 바로 알림)
        async function loadFirst(urls) {
            let lastErr = null;
            for (let i = 0; i < urls.length; i++) {
                try {
                    const layer = await loadKml(urls[i]);
                    zoneKmlUrl = urls[i];
                    return layer;
                } catch (err) {
                    kmlTried.push(urls[i]);
                    lastErr = err;
                    if (!err.notFound) throw err;
                }
            }
            throw lastErr;
        }

        /* ---------- 도형 계산 ---------- */
        function isLatLng(p) {
            return p && typeof p.lat === 'number' && typeof p.lng === 'number';
        }

        function flattenRings(arr, out) {
            if (!arr || !arr.length) return;
            if (isLatLng(arr[0])) { out.push(arr); return; }
            arr.forEach(function(a) { flattenRings(a, out); });
        }

        function collectRings(layer, out) {
            if (layer.getLatLngs) {
                flattenRings(layer.getLatLngs(), out);
            } else if (layer.eachLayer) {
                layer.eachLayer(function(l) { collectRings(l, out); });
            }
        }

        function ringArea(ring) {
            let a = 0;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                a += ring[j].lng * ring[i].lat - ring[i].lng * ring[j].lat;
            }
            return a / 2;
        }

        // 가장 큰 고리의 무게중심
        function centroidOf(rings) {
            let best = rings[0];
            let bestA = Math.abs(ringArea(best));
            rings.forEach(function(r) {
                const a = Math.abs(ringArea(r));
                if (a > bestA) { best = r; bestA = a; }
            });

            if (bestA < 1e-12) {
                let lat = 0, lng = 0;
                best.forEach(function(p) { lat += p.lat; lng += p.lng; });
                return L.latLng(lat / best.length, lng / best.length);
            }

            let cx = 0, cy = 0, a = 0;
            for (let i = 0, j = best.length - 1; i < best.length; j = i++) {
                const f = best[j].lng * best[i].lat - best[i].lng * best[j].lat;
                cx += (best[j].lng + best[i].lng) * f;
                cy += (best[j].lat + best[i].lat) * f;
                a += f;
            }
            a /= 2;
            return L.latLng(cy / (6 * a), cx / (6 * a));
        }

        function pointInRing(pt, ring) {
            let inside = false;
            for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
                const xi = ring[i].lng, yi = ring[i].lat;
                const xj = ring[j].lng, yj = ring[j].lat;
                if ((yi > pt.lat) !== (yj > pt.lat) &&
                    pt.lng < (xj - xi) * (pt.lat - yi) / (yj - yi) + xi) {
                    inside = !inside;
                }
            }
            return inside;
        }

        function inGu(pt, gu) {
            if (!gu.bounds.contains(pt)) return false;
            return gu.rings.some(function(ring) { return pointInRing(pt, ring); });
        }

        // 좌표가 속한 자치구 이름 (없으면 '')
        function guOf(pt) {
            for (let i = 0; i < guList.length; i++) {
                if (inGu(pt, guList[i])) return guList[i].name;
            }
            return '';
        }

        function zoneCenter(layer) {
            if (layer.getLatLng) return layer.getLatLng();
            const rings = [];
            collectRings(layer, rings);
            if (rings.length > 0) return centroidOf(rings);
            return layer.getBounds().getCenter();
        }

        function layerBounds(layer) {
            return layer.getBounds ? layer.getBounds() : L.latLngBounds([layer.getLatLng()]);
        }

        /* ---------- 서울 자치구: 경계선 / 서울 밖 흐림 / 이동 제한 ---------- */
        function buildSeoul(guLayer) {
            guLayer.eachLayer(function(l) {
                const props = (l.feature && l.feature.properties) || {};
                const name = String(props.name || '').trim();
                const rings = [];
                collectRings(l, rings);
                if (!name || rings.length === 0) return;

                const bounds = L.latLngBounds([]);
                rings.forEach(function(r) { r.forEach(function(p) { bounds.extend(p); }); });
                guList.push({ name: name, rings: rings, bounds: bounds, center: null, count: 0 });
            });

            if (guList.length === 0) return;

            seoulBounds = L.latLngBounds([]);
            const allRings = [];

            guList.forEach(function(gu) {
                seoulBounds.extend(gu.bounds);
                guByName[gu.name] = gu;

                // 개수 원은 도형 안쪽에 오도록 (무게중심이 밖이면 경계상자 중심)
                const c = centroidOf(gu.rings);
                const b = gu.bounds.getCenter();
                gu.center = inGu(c, gu) ? c : (inGu(b, gu) ? b : c);

                gu.rings.forEach(function(ring) {
                    allRings.push(ring);
                    // 자치구 경계선 (얇게)
                    L.polygon(ring, {
                        pane: 'boundaryPane',
                        interactive: false,
                        color: '#6b7580',
                        weight: 1,
                        opacity: 0.8,
                        fill: false
                    }).addTo(map);
                });
            });

            // 서울 밖 흐리게: 큰 사각형에서 자치구 도형을 구멍으로 뚫은 반투명 막
            const o = seoulBounds.pad(1);
            const outer = [o.getSouthWest(), o.getNorthWest(), o.getNorthEast(), o.getSouthEast()];
            L.polygon([outer].concat(allRings), {
                pane: 'maskPane',
                interactive: false,
                stroke: false,
                fillColor: '#eef1f3',
                fillOpacity: 0.72
            }).addTo(map);

            applySeoulLimits();
        }

        // 서울 밖으로 일정 거리 이상 벗어나지 못하게 + 그 이상 축소 못 하게
        function applySeoulLimits() {
            if (!seoulBounds) return;
            const limit = seoulBounds.pad(BOUND_PAD);
            map.setMaxBounds(limit);
            map.setMinZoom(map.getBoundsZoom(limit));
        }

        /* ---------- 정비구역 ---------- */
        function buildZones(kmlLayer) {
            kmlLayer.eachLayer(function(layer) {
                const props = (layer.feature && layer.feature.properties) || {};
                const name = props.name || '이름 없는 구역';
                const description = props.description || '';

                if (layer.setStyle) layer.setStyle(defaultStyle);

                // 마우스를 올리면 구역 이름 표시
                if (layer.bindTooltip) {
                    layer.bindTooltip(esc(name), { sticky: true, direction: 'top', className: 'zone-tip' });
                }

                // 자치구는 도형 위치로 판별하고, 안 되면 KML 설명·이름의 구 이름으로 판별
                let district = '';
                if (guList.length > 0) {
                    try { district = guOf(zoneCenter(layer)); } catch (e) { district = ''; }
                }
                if (!district) district = getDistrict(name, description);

                const zone = {
                    name: name,
                    description: description,
                    district: district,
                    haystack: norm(name + ' ' + district + ' ' + stripTags(description)),
                    layer: layer
                };
                zones.push(zone);

                if (guByName[district]) guByName[district].count++;

                layer.on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    openZone(zone, 'map');
                });
            });

            buildCircles();
        }

        // 축소했을 때 보이는 크림슨 반투명 원: 자치구 이름 + 정비구역 개수
        function buildCircles() {
            if (guList.length === 0) return;

            const markers = [];
            guList.forEach(function(gu) {
                if (gu.count === 0) return;

                const icon = L.divIcon({
                    className: 'gu-circle-icon',
                    html: '<div class="gu-circle"><span class="gu-name">' + esc(gu.name) + '</span><span class="gu-count">' + gu.count + '</span></div>',
                    iconSize: [72, 72],
                    iconAnchor: [36, 36]
                });

                const marker = L.marker(gu.center, { icon: icon, keyboard: false });
                marker.on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    zoomToGu(gu);
                });
                markers.push(marker);
            });

            if (markers.length === 0) return;
            circlesGroup = L.layerGroup(markers);
        }

        // 원을 누르면 그 자치구의 정비구역이 보이는 배율로 확대
        function zoomToGu(gu) {
            let b = null;
            zones.forEach(function(z) {
                if (z.district !== gu.name) return;
                const zb = layerBounds(z.layer);
                b = b ? b.extend(zb) : L.latLngBounds(zb.getSouthWest(), zb.getNorthEast());
            });
            if (!b || !b.isValid()) b = gu.bounds;

            let zoom = map.getBoundsZoom(b.pad(0.25));
            zoom = Math.min(Math.max(zoom, ZOOM_ZONES), 16);
            map.setView(b.getCenter(), zoom);
        }

        // 처음 화면: 등록된 구역이 모두 보이도록
        function fitToZones() {
            let b = null;
            zones.forEach(function(z) {
                const zb = layerBounds(z.layer);
                b = b ? b.extend(zb) : L.latLngBounds(zb.getSouthWest(), zb.getNorthEast());
            });
            if (b && b.isValid()) {
                map.fitBounds(b, { padding: [40, 40], maxZoom: 15 });
            }
        }

        /* ---------- 배율·화면 위치에 따라 원 / 구역 표시 전환 ----------
           - ZOOM_ZONES 보다 축소: 자치구별 개수 원만 표시
           - 그 이상 확대: 화면 중심에 있는 자치구의 구역만 표시 */
        function setZoneVisible(zone, show) {
            const on = map.hasLayer(zone.layer);
            if (show && !on) zone.layer.addTo(map);
            else if (!show && on) map.removeLayer(zone.layer);
        }

        // 지금 화면의 중심이 되는 자치구 하나 (화면 안 점들이 가장 많이 속한 자치구, 정중앙 점은 가중치)
        function dominantGu() {
            const b = map.getBounds();
            const counts = {};
            const N = 10;
            for (let i = 0; i <= N; i++) {
                for (let j = 0; j <= N; j++) {
                    const pt = L.latLng(
                        b.getSouth() + (b.getNorth() - b.getSouth()) * i / N,
                        b.getWest() + (b.getEast() - b.getWest()) * j / N
                    );
                    const name = guOf(pt);
                    if (name) counts[name] = (counts[name] || 0) + 1;
                }
            }
            const centerGu = guOf(map.getCenter());
            if (centerGu) counts[centerGu] = (counts[centerGu] || 0) + 5;

            let best = '';
            let bestN = 0;
            Object.keys(counts).forEach(function(name) {
                if (counts[name] > bestN) { best = name; bestN = counts[name]; }
            });
            return best;
        }

        function updateView() {
            if (zones.length === 0 && !circlesGroup) return;

            const zoomedOut = !!circlesGroup && map.getZoom() < ZOOM_ZONES;
            if (DEBUG) console.log('[동네개발맵] 화면 갱신 - 배율 ' + map.getZoom() + (zoomedOut ? ' (축소: 원 표시)' : ' (확대: 구역 표시)') + ', 화면 중심 자치구: ' + (guList.length ? dominantGu() || '(없음)' : '(자치구 KML 없음)'));

            if (zoomedOut) {
                if (!map.hasLayer(circlesGroup)) circlesGroup.addTo(map);
                zones.forEach(function(z) { setZoneVisible(z, z === currentZone || !guByName[z.district]); });
                return;
            }

            if (circlesGroup && map.hasLayer(circlesGroup)) map.removeLayer(circlesGroup);

            // 확대하면 화면 중심 자치구의 구역만 표시 (자치구를 알 수 없는 구역과 선택한 구역은 항상 표시)
            const current = guList.length > 0 ? dominantGu() : '';
            zones.forEach(function(z) {
                const show = z === currentZone ||
                    !current ||
                    !guByName[z.district] ||
                    z.district === current;
                setZoneVisible(z, show);
            });
            if (DEBUG) console.log('[동네개발맵] 지도에 표시 중인 구역: ' + zones.filter(function(z) { return map.hasLayer(z.layer); }).length + ' / ' + zones.length);
        }

        let initDone = false;

        async function initMapData() {
            if (DEBUG) console.log('[동네개발맵] 시작 - 자치구 지원 버전 (구역 경로 후보: ' + ZONE_KML_URLS.join(', ') + ')');

            // 15초가 지나도 응답이 없으면 화면에 알림
            setTimeout(function() {
                if (!initDone) {
                    console.warn('[동네개발맵] KML 응답이 15초 넘게 없습니다. Network 탭을 확인해 주세요.');
                    if (zones.length === 0) {
                        folderListEl.innerHTML = '<div class="panel-msg error">구역 파일 응답이 없습니다. (F12 → Network 탭에서 jae.kml 상태 확인)</div>';
                    }
                }
            }, 15000);
            if (typeof omnivore === 'undefined') {
                console.error('Omnivore 라이브러리를 불러오지 못했습니다.');
                folderListEl.innerHTML = '<div class="panel-msg error">지도 라이브러리를 불러오지 못했습니다.</div>';
                return;
            }

            const results = await Promise.allSettled([loadFirst(ZONE_KML_URLS), loadKml(GU_KML_URL)]);
            const zoneRes = results[0];
            const guRes = results[1];
            if (DEBUG) console.log('[동네개발맵] 불러오기 결과 - 구역 KML:', zoneRes.status, '| 자치구 KML:', guRes.status);

            if (guRes.status === 'fulfilled') {
                try { buildSeoul(guRes.value); } catch (e) { console.error('자치구 KML 처리 오류:', e); }
            } else {
                console.warn('자치구 KML(' + GU_KML_URL + ')을 불러오지 못해 자치구 기능 없이 표시합니다.', guRes.reason && guRes.reason.message ? guRes.reason.message : guRes.reason);
            }

            if (zoneRes.status !== 'fulfilled') {
                const reason = (zoneRes.reason && zoneRes.reason.message) ? zoneRes.reason.message : String(zoneRes.reason);
                console.error('구역 KML을 불러오지 못했습니다. 시도한 경로:', kmlTried.join(', '), zoneRes.reason);
                folderListEl.innerHTML = '<div class="panel-msg error">구역 파일(KML)을 불러오지 못했습니다.<br>' + esc(reason) +
                    '<br>확인한 경로: ' + esc(kmlTried.join(', ')) + '</div>';
                return;
            }

            try {
                buildZones(zoneRes.value);
                initDone = true;
                if (DEBUG) console.log('[동네개발맵] ' + zoneKmlUrl + ' → Placemark ' + ((kmlInfo[zoneKmlUrl] || {}).placemarks) + '개' + ((kmlInfo[zoneKmlUrl] || {}).fixed ? ', 특수문자 자동 보정함' : ''));
                if (DEBUG) console.log('[동네개발맵] 구역 ' + zones.length + '개, 자치구 ' + guList.length + '개 인식, 구역이 속한 자치구:', zones.map(function(z) { return z.name + ' → ' + (z.district || '(없음)'); }));
                if (zones.length === 0) {
                    const info = kmlInfo[zoneKmlUrl] || {};
                    folderListEl.innerHTML = '<div class="panel-msg error">' + esc(zoneKmlUrl) + ' 을(를) 읽었지만 구역 도형이 없습니다.<br>' +
                        'Placemark ' + (info.placemarks != null ? info.placemarks : '?') + '개 중 도형(면·선·점)으로 변환된 것: 0개' +
                        (info.fixed ? '<br>(특수문자를 자동 보정했지만 도형을 찾지 못했습니다)' : '') + '</div>';
                    return;
                }
                buildZoneList();
                renderLeft();
                fitToZones();
                updateView();
                map.on('moveend', updateView);
            } catch (e) {
                initDone = true;
                console.error('구역 처리 오류:', e);
                folderListEl.innerHTML = '<div class="panel-msg error">구역 정보를 처리하는 중 오류가 발생했습니다. (F12 콘솔 확인)</div>';
            }
        }

        initMapData();

        /* =====================================================
           구역 목록 (자치구 폴더)
        ===================================================== */
        function makeZoneRow(zone) {
            const row = document.createElement('button');
            row.type = 'button';
            row.className = 'item-row';
            row.innerHTML = '<span class="row-name">' + esc(zone.name) + '</span>' +
                (zone.district ? '<span class="row-sub">' + esc(zone.district) + '</span>' : '');
            row.addEventListener('click', function() { openZone(zone, 'panel'); });
            return row;
        }

        function buildZoneList() {
            if (zones.length === 0) {
                folderListEl.innerHTML = '<div class="panel-msg">표시할 구역이 없습니다.</div>';
                return;
            }

            const keyOf = function(z) { return z.district || ETC; };

            // 폴더 순서: 처음 등장한 순서, '기타 구역'은 항상 마지막
            const keys = [];
            zones.forEach(function(z) { if (keys.indexOf(keyOf(z)) === -1) keys.push(keyOf(z)); });
            keys.sort(function(a, b) { return (a === ETC) - (b === ETC); });

            folderListEl.innerHTML = '';

            keys.forEach(function(key) {
                const items = zones
                    .filter(function(z) { return keyOf(z) === key; })
                    .sort(function(a, b) { return a.name.localeCompare(b.name, 'ko'); });

                const group = document.createElement('div');

                const title = document.createElement('button');
                title.type = 'button';
                title.className = 'folder-title';
                title.innerHTML = '<span>' + esc(key) + '<span class="folder-count">' + items.length + '</span></span><span class="folder-toggle">−</span>';

                const itemsEl = document.createElement('div');
                itemsEl.className = 'folder-items';

                title.addEventListener('click', function() {
                    const willHide = !itemsEl.hidden;
                    itemsEl.hidden = willHide;
                    title.querySelector('.folder-toggle').textContent = willHide ? '+' : '−';
                });

                items.forEach(function(zone) {
                    const row = makeZoneRow(zone);
                    // 폴더 안에서는 자치구 표기를 생략
                    const sub = row.querySelector('.row-sub');
                    if (sub) sub.remove();
                    itemsEl.appendChild(row);
                });

                group.appendChild(title);
                group.appendChild(itemsEl);
                folderListEl.appendChild(group);
            });
        }

        /* =====================================================
           왼쪽 패널 상태 (목록 / 검색 결과 / 구역 상세)
        ===================================================== */
        function renderLeft() {
            const q = norm(searchInput.value);
            const view = currentZone ? 'detail' : (q ? 'search' : 'list');

            splitEl.dataset.detail = currentZone ? '1' : '0';
            splitEl.dataset.mobilemap = mobileMap ? '1' : '0';
            toggleBtn.textContent = mobileMap ? '목록' : '지도';

            ['list', 'search', 'detail'].forEach(function(v) {
                document.getElementById(v + 'View').classList.toggle('active', v === view);
            });

            if (view === 'search') renderSearch(q);
        }

        /* =====================================================
           구역 선택 / 해제
        ===================================================== */
        function openZone(zone, from) {
            openedFrom = from;
            selectZone(zone);
            renderLeft();
            detailContentEl.scrollTop = 0;
            newsListEl.scrollTop = 0;
            document.querySelector('.detail-scroll').scrollTop = 0;
            moveToZone(zone.layer);
        }

        function closeDetail() {
            clearSelection();
            if (isMobile()) mobileMap = (openedFrom === 'map');
            renderLeft();
        }

        function selectZone(zone) {
            if (currentZone && currentZone !== zone && currentZone.layer.setStyle) {
                currentZone.layer.setStyle(defaultStyle);
            }
            currentZone = zone;
            setZoneVisible(zone, true);
            if (zone.layer.setStyle) zone.layer.setStyle(selectedStyle);

            backLabelEl.textContent = (isMobile() && openedFrom === 'map') ? '지도로 돌아가기' : '목록으로 돌아가기';

            // 설명 안의 이미지는 상단에 따로 배치
            let description = zone.description;
            let imageUrl = null;
            const imgTagMatch = description.match(/<img[^>]+src="([^">]+)"/i) || description.match(/<img[^>]+src='([^'>]+)'/i);
            const urlMatch = description.match(/(https?:\/\/[^\s"'<>]+\.(png|jpg|jpeg|gif|webp))/i);

            if (imgTagMatch && imgTagMatch[1]) {
                imageUrl = imgTagMatch[1];
                description = description.replace(/<img[^>]*>/gi, '');
            } else if (urlMatch && urlMatch[1]) {
                imageUrl = urlMatch[1];
                description = description.replace(urlMatch[1], '');
            }

            const imageHtml = imageUrl
                ? '<div class="detail-image-wrapper"><img src="' + esc(imageUrl) + '" alt="' + esc(zone.name) + ' 이미지"></div>'
                : '';

            detailContentEl.innerHTML =
                imageHtml +
                (zone.district ? '<div class="detail-district">' + esc(zone.district) + '</div>' : '') +
                '<h4 class="detail-title">' + esc(zone.name) + '</h4>' +
                '<div class="detail-desc">' + (description.trim() ? description : '상세 정보가 없습니다.') + '</div>';

            renderNews();
        }

        function clearSelection() {
            if (currentZone && currentZone.layer.setStyle) {
                currentZone.layer.setStyle(defaultStyle);
            }
            currentZone = null;
            updateView();
        }

        function moveToZone(layer) {
            if (layer.getBounds) {
                map.fitBounds(layer.getBounds(), { padding: [60, 60], maxZoom: 16 });
            } else if (layer.getLatLng) {
                map.setView(layer.getLatLng(), 16);
            }
        }

        backBtn.addEventListener('click', closeDetail);

        map.on('click', function() {
            if (currentZone) closeDetail();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            if (document.activeElement === searchInput && searchInput.value) {
                searchInput.value = '';
                renderLeft();
            } else if (currentZone) {
                closeDetail();
            }
        });

        /* =====================================================
           검색 (구역: 이름·설명·자치구 / 기사: 제목·본문)
        ===================================================== */
        searchInput.addEventListener('focus', function() {
            if (isMobile() && !currentZone && mobileMap) {
                mobileMap = false;
                renderLeft();
            }
        });

        searchInput.addEventListener('input', function() {
            if (currentZone) clearSelection();
            if (isMobile()) mobileMap = false;
            renderLeft();
        });

        toggleBtn.addEventListener('click', function() {
            mobileMap = !mobileMap;
            if (mobileMap) searchInput.blur();
            renderLeft();
        });

        function renderSearch(q) {
            const zoneHits = zones.filter(function(z) { return z.haystack.includes(q); });
            let articleHtml = '';

            if (articlesState === 'loading') {
                articleHtml = '<div class="panel-title">기사</div><div class="panel-msg">기사를 불러오는 중...</div>';
            } else if (articlesState === 'ready') {
                const hits = allArticles.filter(function(a) { return isRealEstate(a) && articleText(a).includes(q); }).slice(0, 10);
                if (hits.length > 0) {
                    articleHtml = '<div class="panel-title">기사<span class="count">' + hits.length + '</span></div>' + hits.map(newsItemHtml).join('');
                }
            }

            searchResultsEl.innerHTML = '';

            if (zoneHits.length > 0) {
                const title = document.createElement('div');
                title.className = 'panel-title';
                title.innerHTML = '구역<span class="count">' + zoneHits.length + '</span>';
                searchResultsEl.appendChild(title);
                zoneHits.forEach(function(z) { searchResultsEl.appendChild(makeZoneRow(z)); });
            }

            if (articleHtml) {
                const wrap = document.createElement('div');
                wrap.innerHTML = articleHtml;
                searchResultsEl.appendChild(wrap);
            }

            if (zoneHits.length === 0 && !articleHtml) {
                searchResultsEl.innerHTML = '<div class="panel-msg">‘' + esc(searchInput.value.trim()) + '’에 대한 검색 결과가 없습니다.</div>';
            }
        }

        /* =====================================================
           관련 뉴스
           - 기사 JSON에 "zone" 필드를 넣으면 그 구역과 연결됨
             예) "zone": "사가정역세권"  또는  "zone": ["사가정역세권", "면목동 일대"]
             (KML 구역 이름과 같거나, 한쪽이 다른 쪽을 포함하면 연결)
           - zone 필드가 없는 '부동산' 기사는 제목·본문에 구역 이름이 들어 있으면 연결
        ===================================================== */
        const ARTICLES_API = 'https://api.github.com/repos/sin13248920/seo-weekly-test/contents/articles';
        let allArticles = [];
        let articlesState = 'loading'; // loading | ready | error

        async function fetchArticles() {
            try {
                const response = await fetch(ARTICLES_API);
                if (!response.ok) throw new Error('GitHub API 오류: ' + response.status);
                const files = await response.json();

                const jsonFiles = files
                    .filter(function(file) { return file.type === 'file' && file.name.toLowerCase().endsWith('.json'); })
                    .sort(function(a, b) { return b.name.localeCompare(a.name); });

                // 기사 파일을 동시에 불러와 로딩 시간을 줄임
                const loaded = await Promise.all(jsonFiles.map(async function(file) {
                    try {
                        const res = await fetch(file.download_url);
                        if (!res.ok) return null;
                        const data = await res.json();
                        return Object.assign({ id: file.name.replace(/\.json$/i, '') }, data);
                    } catch (e) {
                        console.error(e);
                        return null;
                    }
                }));

                allArticles = loaded
                    .filter(Boolean)
                    .sort(function(a, b) { return String(b.id).localeCompare(String(a.id)); });
                articlesState = 'ready';
            } catch (e) {
                console.error(e);
                articlesState = 'error';
            }
            renderNews();
            renderLeft();
        }

        function articleText(art) {
            const body = Array.isArray(art.content)
                ? art.content.map(function(c) { return typeof c === 'string' ? c : (c && c.value) || ''; }).join('')
                : '';
            return norm((art.title || '') + body);
        }

        function isRealEstate(art) {
            return !!(art.category && art.category.includes('부동산'));
        }

        function relatedArticles(zoneName) {
            const z = norm(zoneName);
            if (!z) return [];
            return allArticles.filter(function(art) {
                const zoneField = art.zone ? [].concat(art.zone) : [];
                if (zoneField.length > 0) {
                    return zoneField.some(function(f) {
                        const n = norm(f);
                        return n && (z.includes(n) || n.includes(z));
                    });
                }
                return isRealEstate(art) && articleText(art).includes(z);
            });
        }

        function newsItemHtml(art) {
            return '<a class="news-item" href="viewer.html?id=' + encodeURIComponent(art.id) + '">' +
                '<div class="news-thumb"><img src="' + esc(getThumbUrl(art.image)) + '" alt="" loading="lazy" onerror="' + THUMB_ONERROR + '"></div>' +
                '<div class="news-text">' +
                    '<div class="news-title">' + esc(art.title) + '</div>' +
                    (art.date ? '<div class="news-date">' + esc(art.date) + '</div>' : '') +
                '</div></a>';
        }

        function renderNews() {
            if (!currentZone) return;

            if (articlesState === 'loading') {
                newsListEl.innerHTML = '<div class="panel-msg">뉴스를 불러오는 중...</div>';
                return;
            }
            if (articlesState === 'error') {
                newsListEl.innerHTML = '<div class="panel-msg error">뉴스를 불러오지 못했습니다.</div>';
                return;
            }

            const list = relatedArticles(currentZone.name);
            newsListEl.innerHTML = list.length > 0
                ? list.map(newsItemHtml).join('')
                : '<div class="panel-msg">이 구역과 연결된 기사가 아직 없습니다.</div>';
        }

        renderLeft();
        fetchArticles();
    </script>
</body>
