                    const d = metersBetween(c.lat, c.lng, lat, lon);
                    item = { kind: kind, name: name, rank: 0, latlng: L.latLng(lat, lon), dist: d, score: d };
                }

                const key = item.kind + '|' + item.name;
                if (!best[key] || item.score < best[key].score) best[key] = item;
            });

            return Object.keys(best).map(function(k) { return best[k]; });
        }

        function poiTextWidth(text, size) {
            let w = 0;
            for (let i = 0; i < text.length; i++) {
                w += /[\u1100-\u11FF\u3130-\u318F\uAC00-\uD7AF\u4E00-\u9FFF]/.test(text[i]) ? size : size * 0.58;
            }
            return w;
        }

        function boxesOverlap(a, b) {
            return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
        }

        function clearPoiLabels() {
            if (poiLayer) { map.removeLayer(poiLayer); poiLayer = null; }
        }

        function renderPoiLabels() {
            clearPoiLabels();
            if (!captureMode || !currentZone || !poiData) return;

            const size = map.getSize();
            const placed = [];
            const reserve = function(x, y, w, h) { placed.push({ x1: x - w / 2, y1: y - h / 2, x2: x + w / 2, y2: y + h / 2 }); };

            // '대상지' 글자와 반경 글자 자리를 먼저 비워 둠
            const cp = map.latLngToContainerPoint(poiData.center);
            reserve(cp.x, cp.y, 96, 38);          // '대상지' 글자 (22px, 3글자)
            RING_RADII.forEach(function(r) {
                const tp = map.latLngToContainerPoint(L.latLng(poiData.center.lat + r / 111320, poiData.center.lng));
                reserve(tp.x, tp.y - 10, 58, 20);     // '500m' · '1km' 글자
            });

            const counts = {};
            const markers = [];
            const sorted = poiData.items.slice().sort(function(x, y) {
                return (POI_ORDER.indexOf(x.kind) - POI_ORDER.indexOf(y.kind)) || (x.rank - y.rank) || (x.dist - y.dist);
            });

            sorted.forEach(function(it) {
                if ((counts[it.kind] || 0) >= POI_LIMIT[it.kind]) return;

                const p = map.latLngToContainerPoint(it.latlng);
                if (p.x < -60 || p.y < -40 || p.x > size.x + 60 || p.y > size.y + 40) return;   // 화면 밖

                const fs = POI_FONT[it.kind];
                const w = poiTextWidth(it.name, fs) + (it.kind === 'road' ? 0 : 14);
                const h = fs * 1.4;
                let bw = w, bh = h, angle = 0;

                if (it.kind === 'road') {
                    // 글씨를 도로 방향으로 눕히되, 뒤집히지 않게 -90°~90° 범위로 맞춤
                    const pa = map.latLngToContainerPoint(it.a);
                    const pb = map.latLngToContainerPoint(it.b);
                    if (pa.x !== pb.x || pa.y !== pb.y) {
                        angle = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
                        if (angle > 90) angle -= 180;
                        if (angle < -90) angle += 180;
                    }
                    const rad = angle * Math.PI / 180;
                    bw = Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad));
                    bh = Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad));
                }

                const box = { x1: p.x - bw / 2 - 3, y1: p.y - bh / 2 - 2, x2: p.x + bw / 2 + 3, y2: p.y + bh / 2 + 2 };
                if (placed.some(function(o) { return boxesOverlap(o, box); })) return;   // 겹치면 생략
                placed.push(box);
                counts[it.kind] = (counts[it.kind] || 0) + 1;

                const style = 'font-size:' + fs + 'px;color:' + POI_COLOR[it.kind] +
                    (angle ? ';transform:translate(-50%,-50%) rotate(' + angle.toFixed(1) + 'deg)' : '');
                markers.push(L.marker(it.latlng, {
                    pane: 'poiPane',
                    interactive: false,
                    keyboard: false,
                    icon: L.divIcon({
                        className: 'poi-label-icon',
                        html: '<div class="poi-label ' + (it.kind === 'road' ? 'road' : 'facility') + '" style="' + style + '">' + esc(it.name) + '</div>',
                        iconSize: [0, 0]
                    })
                }));
            });

            poiLayer = L.layerGroup(markers).addTo(map);
            if (DEBUG) console.log('[동네개발맵] 주변 이름 표시:', JSON.stringify(counts), '(불러온 항목 ' + poiData.items.length + '개)');
        }

        async function loadPoi(center) {
            const key = center.lat.toFixed(4) + ',' + center.lng.toFixed(4);
            if (poiData && poiData.key === key) { renderPoiLabels(); return; }

            const myReq = ++poiReq;
            try {
                const data = await fetchOverpass(center);
                if (myReq !== poiReq) return;   // 그 사이 다른 구역을 골랐거나 모드를 껐으면 무시
                poiData = { key: key, center: center, items: parsePoi(data, center) };
                renderPoiLabels();
            } catch (e) {
                if (myReq !== poiReq) return;
                poiData = null;
                if (DEBUG) console.warn('[동네개발맵] 주변 도로·시설 정보를 불러오지 못했습니다.', e && e.message ? e.message : e);
                showToast('주변 도로·시설 정보를 불러오지 못했어요');
            }
        }

        map.on('moveend', function() { if (captureMode) renderPoiLabels(); });

        function updateTargetTag() {
            if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }
            if (ringGroup) { map.removeLayer(ringGroup); ringGroup = null; }
            clearPoiLabels();

            const active = captureMode && currentZone;      // 캡쳐 모드에서 구역이 선택돼 있음
            const wantTag = active && !targetHidden;        // '대상지' 글자를 보이는 상태

            // 이전 구역의 이름표 복구
            if (targetZone && (!wantTag || targetZone !== currentZone)) {
                setLabelHidden(targetZone, false);
                targetZone = null;
            }
            if (!active) { poiReq++; return; }   // 진행 중이던 주변 정보 요청은 무효 처리

            const center = labelPoint(currentZone.layer);
            drawRings(center);
            loadPoi(center);                                // 주변 도로·시설 이름 (캡쳐 모드)                              // 반경은 '대상지' 글자를 꺼도 그대로 표시
            if (!wantTag) return;

            targetMarker = L.marker(center, {
                pane: 'tooltipPane',
                interactive: false,
                keyboard: false,
                icon: L.divIcon({
                    className: 'target-tag-icon',
                    html: '<div class="target-tag" style="color:' + zoneColor(currentZone) + '">대상지</div>',
                    iconSize: [0, 0]
                })
            }).addTo(map);

            // 같은 자리의 원래 이름표는 숨김 (대상지 글자로 대체)
            targetZone = currentZone;
            setLabelHidden(currentZone, true);
        }

        function setCaptureMode(on) {
            captureMode = on;
            document.body.classList.toggle('capture-mode', on);
            if (on) targetHidden = false;

            // 화면 구성이 바뀌었으니 지도 크기를 다시 맞춤
            map.invalidateSize();
            applySeoulLimits();
            setTimeout(function() { map.invalidateSize(); }, 120);

            updateTargetTag();

            showToast(on ? '캡쳐 모드 켜짐  (0 + Enter: 대상지 표시 끄기/켜기 · 55 + Enter 또는 Esc: 해제)' : '캡쳐 모드 해제');
            if (DEBUG) console.log('[동네개발맵] 캡쳐 모드:', on ? '켜짐' : '해제');
        }

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            const t = e.target;
            const tag = (t && t.tagName) || '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;

            if (/^[0-9]$/.test(e.key)) {
                codeBuffer += e.key;
                clearTimeout(codeTimer);
                codeTimer = setTimeout(function() { codeBuffer = ''; }, 2500);   // 2.5초 안에 이어서 입력
                return;
            }

            if (e.key === 'Enter') {
                const code = codeBuffer;
                codeBuffer = '';
                clearTimeout(codeTimer);
                if (!code) return;   // 숫자 없이 누른 Enter는 그대로 둠

                let handled = false;
                if (captureMode) {
                    if (code === TARGET_TOGGLE_CODE) {
                        targetHidden = !targetHidden;       // 알림 없이 '대상지' 표시만 껐다 켰다
                        updateTargetTag();
                        handled = true;
                    } else if (code === STAGE2_CODE) {
                        setCaptureMode(false);
                        handled = true;
                    }
                } else if (code === STAGE1_CODE) {
                    stage1Until = Date.now() + STAGE1_TTL_MS;   // 1단계: 아무 알림 없음
                    handled = true;
                } else if (code === STAGE2_CODE && Date.now() < stage1Until) {
                    stage1Until = 0;
                    setCaptureMode(true);                       // 2단계: 알림과 함께 켜짐
                    handled = true;
                } else {
                    stage1Until = 0;                            // 틀린 번호면 1단계부터 다시
                }

                if (handled) e.preventDefault();   // 포커스된 버튼이 함께 눌리는 것 방지
                return;
            }

            if (e.key !== 'Shift') codeBuffer = '';
        });

        renderLeft();
        fetchArticles();
    </script>
</body>
</html>
